<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RoomSplit | Add Expense</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="common.css">

    <link rel="stylesheet"
          href="expense.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="page-header">

        <a href="dashboard.html">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2 id="pageTitle">Add Expense</h2>

    </header>

    <!-- Form -->

    <form id="expenseForm" class="expense-card">

        <!-- Expense Title -->

        <div class="input-group">

            <label>Expense Title</label>

            <input
                type="text"
                id="expenseTitle"
                placeholder="Example : Chicken"
                required>

        </div>

        <!-- Amount -->

        <div class="input-group">

            <label>Amount (₹)</label>

            <input
                type="number"
                id="expenseAmount"
                placeholder="Enter Amount"
                min="1"
                required>

        </div>

        <!-- Category -->

        <div class="input-group">

            <label>Category</label>

            <select id="expenseCategory">

                <option value="Food">
                    🍗 Food
                </option>

                <option value="Grocery">
                    🛒 Grocery
                </option>

                <option value="Others">
                    🎉 Others
                </option>

            </select>

        </div>

        <!-- Other Category -->

        <div
            id="otherCategoryBox"
            class="input-group hidden">

            <label>Category Name</label>

            <input
                type="text"
                id="otherCategory"
                placeholder="Example : Electricity">

        </div>

        <!-- Paid By -->

        <div class="input-group">

            <label>Paid By</label>

            <select id="paidBy">

                <option value="subham">
                    👤 Subham
                </option>

                <option value="subhankar">
                    👤 Subhankar
                </option>

                <option value="soumya">
                    👤 Soumya
                </option>

            </select>

        </div>

        <!-- Split Between -->

        <div class="input-group">

            <label>Split Between</label>

            <div id="memberList">

</div>

        </div>

        <!-- Save -->

        <button
    type="submit"
    class="save-btn"
    id="saveBtn">

    <i class="fa-solid fa-floppy-disk"></i>

    <span id="saveBtnText">
        Save Expense
    </span>

</button>

    </form>

</div>

<script src="api.js"></script>
<script src="expense.js"></script>

</body>

</html>
