<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RoomSplit | History</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="common.css">

    <link rel="stylesheet"
          href="history.css">
    <link rel="stylesheet" href="toast.css">     

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="page-header">

        <a href="dashboard.html">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2>

            Expense History

        </h2>

    </header>

    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Expense...">

    </div>

    <!-- History List -->

    <div
        id="historyList"
        class="history-list">

        <!-- JS -->

    </div>

</div>

<!-- Edit Modal -->

<div
    id="editModal"
    class="modal hidden">

    <div class="modal-content">

        <h2>Edit Expense</h2>

        <input
            type="hidden"
            id="editId">

        <div class="input-group">

            <label>

                Expense Title

            </label>

            <input
                type="text"
                id="editTitle">

        </div>

        <div class="input-group">

            <label>

                Amount

            </label>

            <input
                type="number"
                id="editAmount">

        </div>

        <div class="input-group">

            <label>

                Category

            </label>

            <select id="editCategory">

                <option value="Food">

                    🍗 Food

                </option>

                <option value="Grocery">

                    🛒 Grocery

                </option>

                <option value="Others">

                    🎉 Others

                </option>

            </select>

        </div>

        <div
            id="editOtherBox"
            class="input-group hidden">

            <label>

                Category Name

            </label>

            <input
                type="text"
                id="editOtherCategory">

        </div>

        <div class="input-group">

            <label>

                Paid By

            </label>

            <select id="editPaidBy">

                <option value="subham">

                    Subham

                </option>

                <option value="subhankar">

                    Subhankar

                </option>

                <option value="soumya">

                    Soumya

                </option>

            </select>

        </div>

        <div class="input-group">

            <label>

                Split Between

            </label>

            <div id="editMembers">

                <label class="member">

                    <input
                        type="checkbox"
                        value="subham">

                    <span>Subham</span>

                </label>

                <label class="member">

                    <input
                        type="checkbox"
                        value="subhankar">

                    <span>Subhankar</span>

                </label>

                <label class="member">

                    <input
                        type="checkbox"
                        value="soumya">

                    <span>Soumya</span>

                </label>

            </div>

        </div>

        <div class="modal-buttons">

            <button
                id="updateBtn">

                Update

            </button>

            <button
                id="cancelBtn">

                Cancel

            </button>

        </div>

    </div>

</div>


<!-- ==========================================
     Settlement Modal
========================================== -->

<div id="settlementModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeSettlementModal" class="close-modal">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>Settle Payment</h2>

        <!-- Amount -->
        <div id="paymentInfo" class="payment-info">

            <h3 id="paymentAmount">₹0.00</h3>

            <small>Pay To</small>

            <p id="paymentReceiver">-</p>

        </div>

        <!-- QR -->
        <div id="qrPayment" class="hidden">

    <div class="qr-wrapper">

        <img
            id="upiQR"
            alt="UPI QR Code">

    </div>

    <p id="upiIdText">-</p>

    <button
        id="copyUpiBtn"
        class="secondary-btn">

        📋 Copy UPI ID

    </button>

</div>

        <!-- Payment Methods -->

        <div class="payment-options">

    <div
        class="payment-card active"
        data-method="Cash">

        💵 Cash

    </div>

    <div
        class="payment-card"
        data-method="UPI">

        📱 UPI / Any UPI App

    </div>

</div>

<input
    type="hidden"
    id="paymentMethod"
    value="Cash">

        <!-- Buttons -->

        <div class="modal-buttons">

            <button id="confirmSettlementBtn">

                Continue →

            </button>

            <button id="cancelSettlementBtn">

                Cancel

            </button>

        </div>

    </div>

</div>
<script src="toast.js"></script>
<script src="api.js"></script>
<script src="history.js"></script>

</body>

</html>
